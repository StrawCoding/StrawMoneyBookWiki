name: Deploy Wiki to GitHub Pages (org root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: docs/.vitepress/dist

  deploy-org-root:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: dist

      - name: Deploy to StrawCoding.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.STRAWCODING_ORG_PAGES_TOKEN }}
          external_repository: StrawCoding/StrawCoding.github.io
          publish_branch: main
          publish_dir: dist
          force_orphan: true
          commit_message: 'docs: sync StrawMoneyBook Wiki from StrawMoneyBookWiki'
